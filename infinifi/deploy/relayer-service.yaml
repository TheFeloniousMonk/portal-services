# The infinifi entry for the HA relayer's config (relayer-config.yaml, under
# `services:`). add-to-relayer.sh inserts it and restarts the relayer. The key is the
# service id; `rest` is the card's rpc_types[].type lowercased.
#
# Responses are small (the largest, a full-history wallet series by chain, is
# about 25 KB), so the default body cap is ample. The health-check deadline sits
# above the backend's 8 s upstream deadline, since /healthz may wait on infiniFi
# once a minute when its cache expires.
  infinifi:
    timeout_profile: fast
    max_body_size_bytes: 20971520
    default_backend: rest
    backends:
      rest:
        url: "http://infinifi-backend:8080"
        health_check:
          endpoint: "/healthz"
          interval_seconds: 10
          timeout_seconds: 9
