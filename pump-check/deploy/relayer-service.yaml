# The pump-check entry for the HA relayer's config (relayer-config.yaml, under
# `services:`). add-to-relayer.sh inserts it and restarts the relayer. The key is
# the service id; `rest` is the card's rpc_types[].type lowercased.
#
# A check of up to 10 tokens answers within about 11 s (PUMP_CHECK_DEADLINE_MS),
# inside the fast profile's 30 s request timeout. The health check waits on
# nothing upstream: /healthz reports the last ingest and the RPC state.
  pump-check:
    timeout_profile: fast
    max_body_size_bytes: 20971520
    default_backend: rest
    backends:
      rest:
        url: "http://pump-check-backend:8080"
        health_check:
          endpoint: "/healthz"
          interval_seconds: 10
          timeout_seconds: 5
