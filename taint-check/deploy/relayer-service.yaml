# The taint-check entry for the HA relayer's config (relayer-config.yaml, under
# `services:`). add-to-relayer.sh inserts it and restarts the relayer. The key is the
# service id; `rest` is the card's rpc_types[].type lowercased.
#
# max_body_size covers both a large lockfile in (4 MiB cap) and a large scan
# result out (a big manifest with many findings), with headroom.
  taint-check:
    timeout_profile: fast
    max_body_size_bytes: 20971520
    default_backend: rest
    backends:
      rest:
        url: "http://taint-check-backend:8080"
        health_check:
          endpoint: "/healthz"
          interval_seconds: 10
          timeout_seconds: 5
