# Supplier stake config for taint-check on beta.
# Stake with:
#   pocketd tx supplier stake-supplier --config ./supplier_stake_config.yaml \
#     --from operator --network=beta \
#     --gas auto --gas-prices 1upokt --gas-adjustment 1.5
#
# Before staking, send any tx from the operator account once so its public key is
# on-chain, or gateways will reject its signed responses.
#
# stake_amount must be at least the live supplier min_stake. Re-check it:
#   pocketd query supplier params --network=beta

owner_address: pokt17y9vafx5xag4gzmhrmudclj89g73u78uxts08t
operator_address: pokt1v8v0pejdgejkqvaynluhxnp2w7rpdergd26tuk
stake_amount: 59500000000upokt

# Revenue split; addresses must sum to exactly 100. 100% to owner by default.
default_rev_share_percent:
  pokt17y9vafx5xag4gzmhrmudclj89g73u78uxts08t: 100

services:
  - service_id: taint-check
    endpoints:
      # rpc_type MUST match the card's rpc_types[].type, or clients of that
      # transport never see this endpoint.
      - publicly_exposed_url: https://services-beta.agentdata.network
        rpc_type: REST
