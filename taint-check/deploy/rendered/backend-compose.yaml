# taint-check backend on the supplier host. Starts only the backend container and
# joins the supplier stack's network (templates/ha/docker-compose.yaml), where the
# relayer reaches it as http://taint-check-backend:8080. Nothing is exposed to the
# internet. Put it in /opt/pocket/services/taint-check/deploy/ next to backend/.
#
#   docker compose -p taint-check up -d --build

services:
  backend:
    build: ../backend
    image: taint-check-backend:latest
    container_name: taint-check-backend
    restart: unless-stopped
    expose:
      - "8080"
    networks: [supplier]

networks:
  supplier:
    external: true
    name: pocket-supplier
